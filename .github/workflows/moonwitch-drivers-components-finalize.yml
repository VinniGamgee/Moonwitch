name: Moonwitch Drivers Components Finalize

on:
  push:
    branches:
      - exp/moonwitch-reconstruction-stage10-classic-ui
    paths:
      - .github/workflows/moonwitch-drivers-components-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: exp/moonwitch-reconstruction-stage10-classic-ui
          fetch-depth: 0
      - name: Apply organization
        run: python3 .github/scripts/finalize_drivers_components.py
      - name: Commit final change and remove one-shot helpers
        run: |
          rm -f .github/workflows/moonwitch-drivers-components-finalize.yml .github/scripts/finalize_drivers_components.py
          git config user.name "Moonwitch CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --check --cached
          git commit -m "Moonwitch: add dedicated Drivers and Components section"
          git push origin HEAD:exp/moonwitch-reconstruction-stage10-classic-ui
