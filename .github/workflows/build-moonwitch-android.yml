name: Build Moonwitch Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Moonwitch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup host shader tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools
          glslangValidator --version
          spirv-opt --version

      - name: Setup Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Apply build-environment compatibility
        shell: bash
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' src/android/gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/android/app/build.gradle.kts')
          s = p.read_text()
          old = '''    externalNativeBuild {\n        cmake {\n            path = file("${edenDir}/CMakeLists.txt")\n        }\n    }'''
          new = '''    externalNativeBuild {\n        cmake {\n            path = file("${edenDir}/CMakeLists.txt")\n            version = "3.31.6"\n        }\n    }'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'version = "3.31.6"' not in s:
              raise SystemExit('Gradle CMake block not found')
          p.write_text(s)
          PY

      - name: Build Moonwitch arm64 Nightly Release APK
        id: moonwitch_build
        continue-on-error: true
        shell: bash
        env:
          CCACHE: 'false'
        run: |
          chmod +x .ci/android/build.sh src/android/gradlew
          set +e
          .ci/android/build.sh -n -t standard -b Release > "$GITHUB_WORKSPACE/moonwitch-build.log" 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Print concise build failure
        if: steps.moonwitch_build.outputs.rc != '0'
        shell: bash
        run: |
          echo '===== MOONWITCH BUILD ERROR: LAST 220 LINES ====='
          tail -n 220 "$GITHUB_WORKSPACE/moonwitch-build.log"
          echo '===== END MOONWITCH BUILD ERROR ====='

      - name: Fail when compiler failed
        if: steps.moonwitch_build.outputs.rc != '0'
        shell: bash
        run: exit 1

      - name: Show artifacts
        if: steps.moonwitch_build.outputs.rc == '0'
        run: find artifacts -maxdepth 2 -type f -printf '%p %k KB\n' || true

      - name: Upload Moonwitch APK
        if: steps.moonwitch_build.outputs.rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: MOONWITCH-0.1.0-alpha-Android-arm64-nightly
          path: |
            artifacts/*.apk
            artifacts/*.aab
          if-no-files-found: error
          retention-days: 7
