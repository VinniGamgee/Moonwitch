name: Build Eden Master Baseline V2

on:
  push:
    branches: ["build/eden-master-baseline"]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Select CMake 3.31.6 for CI
        run: |
          sed -i '/path = file("${edenDir}\/CMakeLists.txt")/a\            version = "3.31.6"' src/android/app/build.gradle.kts
          grep -A3 'externalNativeBuild' src/android/app/build.gradle.kts | head -n 8

      - name: Build Android baseline
        env:
          CCACHE: "false"
        run: |
          chmod +x .ci/android/build.sh src/android/gradlew
          .ci/android/build.sh -n -t standard -b Release

      - uses: actions/upload-artifact@v4
        with:
          name: EDEN-MASTER-BASELINE-119291dc
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
