name: Moonwitch Classic UI

on:
  workflow_dispatch:
  push:
    branches:
      - exp/moonwitch-reconstruction-stage10-classic-ui

permissions:
  contents: read

concurrency:
  group: moonwitch-classic-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Guard Moonwitch core features
        shell: bash
        run: |
          if ! grep -q "TOTK_PROGRAM_ID" src/video_core/renderer_vulkan/vk_rasterizer.cpp; then
            echo "TOTK foliage workaround is missing; refusing to build."
            exit 1
          fi
          grep -q "moonwitch_reconstruction" src/common/settings.h
          grep -q "reconstruction_bias" src/video_core/renderer_vulkan/vk_texture_cache.cpp
          grep -q "MOONWITCH_RECONSTRUCTION" src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/model/BooleanSetting.kt
          grep -q "MOONWITCH_RECONSTRUCTION_TARGET" src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/model/IntSetting.kt

          # SGSR2 temporal work was intentionally retired. Keep the useful MIP/LOD
          # texture-detail feature, but never regenerate the abandoned temporal plumbing.
          for file in \
            src/video_core/renderer_vulkan/present/sgsr2_resources.cpp \
            src/video_core/renderer_vulkan/present/sgsr2_resources.h \
            src/video_core/renderer_vulkan/present/sgsr2_runtime_inputs.h \
            src/video_core/renderer_vulkan/present/sgsr2_motion_probe.cpp \
            src/video_core/renderer_vulkan/present/sgsr2_motion_probe.h; do
            if [ -e "$file" ]; then
              echo "Retired SGSR2 temporal file unexpectedly present: $file"
              exit 1
            fi
          done
          git diff --check

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Validate classic UI and current feature wiring
        shell: bash
        run: |
          grep -q "updateButtonsVisibility" src/android/app/src/main/java/org/yuzu/yuzu_emu/ui/GamesFragment.kt
          grep -q "filter_favorites" src/android/app/src/main/java/org/yuzu/yuzu_emu/ui/GamesFragment.kt
          grep -q "SECTION_MOONWITCH_PERFORMANCE" src/android/app/src/main/java/org/yuzu/yuzu_emu/fragments/HomeSettingsFragment.kt
          grep -q '@+id/settings_button' src/android/app/src/main/res/layout/fragment_games.xml
          grep -q '@+id/launch_qlaunch' src/android/app/src/main/res/layout/fragment_games.xml
          if grep -q '@+id/bottom_nav' src/android/app/src/main/res/layout/fragment_games.xml; then
            echo "Modern bottom navigation is present in the classic frontend; refusing to build."
            exit 1
          fi
          git diff --check

      - name: Build
        shell: bash
        env:
          CCACHE: 'false'
        run: |
          chmod +x .ci/android/build.sh src/android/gradlew

          set +e
          (
            cd src/android
            ./gradlew :app:compileMainlineReleaseKotlin --console=plain --warning-mode none
          ) > /tmp/moonwitch-kotlin.log 2>&1
          kotlin_status=$?
          set -e
          if [ "$kotlin_status" -ne 0 ]; then
            echo "===== MOONWITCH KOTLIN ERROR EXTRACT ====="
            grep -nE '(^e: |error:|FAILURE:|What went wrong|Execution failed|Compilation error|Unresolved reference|Type mismatch|Cannot infer|Expecting |No value passed|Too many arguments|Overload resolution|CMake Error|FATAL_ERROR|not found)' /tmp/moonwitch-kotlin.log | tail -n 220 || true
            echo "===== END KOTLIN ERROR EXTRACT ====="
            exit "$kotlin_status"
          fi

          echo "Kotlin preflight passed; starting full Android build."
          set +e
          .ci/android/build.sh -t standard -b Release > /tmp/moonwitch-build.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "===== MOONWITCH BUILD ERROR EXTRACT ====="
            grep -nE '(^e: |error:|FAILURE:|What went wrong|Execution failed|Compilation error|Unresolved reference|Type mismatch|Cannot infer|Expecting |No value passed|Too many arguments|Overload resolution|CMake Error|FATAL_ERROR|not found|No such file)' /tmp/moonwitch-build.log | tail -n 220 || true
            echo "===== END ERROR EXTRACT ====="
          else
            tail -n 80 /tmp/moonwitch-build.log
          fi
          exit "$status"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOONWITCH-CLASSIC-UI
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 7
