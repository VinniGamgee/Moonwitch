name: Moonwitch Android Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Build
        shell: bash
        env:
          CCACHE: 'false'
        run: |
          chmod +x .ci/android/build.sh src/android/gradlew
          .ci/android/build.sh -t standard -b Release

      - name: Verify Moonwitch identity
        shell: bash
        run: |
          APK=$(find artifacts -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "APK: $APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/moonwitch-badging.txt
          grep -F "package: name='com.moonwitch.emulator'" /tmp/moonwitch-badging.txt
          grep -F "application-label:'Moonwitch'" /tmp/moonwitch-badging.txt
          if grep -Fqi 'Eden' /tmp/moonwitch-badging.txt; then
            echo "ERROR: legacy branding detected in APK identity."
            exit 1
          fi
          if grep -Fqi 'Nightly' /tmp/moonwitch-badging.txt; then
            echo "ERROR: nightly branding detected in standard Moonwitch build."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOONWITCH-ANDROID
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
