name: Moonwitch Game Hub V2.2 Staging

on:
  push:
    branches:
      - work/gamehub-v22

permissions:
  contents: write

concurrency:
  group: moonwitch-gamehub-v22-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply V2.2 source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_gamehub_v22.py
          git config user.name "Moonwitch CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/scripts/apply_gamehub_v22.py
          git add -A
          git diff --cached --check
          grep -q "BottomSheetDialog(requireContext())" src/android/app/src/main/java/org/yuzu/yuzu_emu/fragments/GamePropertiesFragment.kt
          grep -q "findCoverArtwork" src/android/app/src/main/java/org/yuzu/yuzu_emu/fragments/GamePropertiesFragment.kt
          test -s src/android/app/src/main/res/layout/bottom_sheet_gamehub_more.xml
          git commit -m "Moonwitch: Game Hub V2.2 frontend [skip ci]"
          git push origin HEAD:work/gamehub-v22
