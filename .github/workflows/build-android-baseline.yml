name: Moonwitch Home Frontend V1 Staging

on:
  push:
    branches:
      - work/home-frontend-v1

permissions:
  contents: write

concurrency:
  group: moonwitch-home-frontend-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply Home Frontend V1 Kotlin patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_home_frontend_v1.py
          git config user.name "Moonwitch CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/scripts/apply_home_frontend_v1.py
          git add -A
          git diff --cached --check
          grep -q "libraryHeroBackdrop" src/android/app/src/main/java/org/yuzu/yuzu_emu/ui/GamesFragment.kt
          grep -q '@+id/library_hero_backdrop' src/android/app/src/main/res/layout/fragment_games.xml
          grep -q 'mw_home_frontend_open_hub' src/android/app/src/main/res/values-pt-rBR/moonwitch_home_frontend.xml
          git commit -m "Moonwitch: Home Frontend V1 [skip ci]"
          git push origin HEAD:work/home-frontend-v1
