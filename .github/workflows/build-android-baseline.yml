name: Moonwitch Vulkan Submission Batching

on:
  workflow_dispatch:
  push:
    branches:
      - exp/moonwitch-vulkan-batching
      - exp/moonwitch-core-director-v2

permissions:
  contents: read

concurrency:
  group: moonwitch-vulkan-batching-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Apply Moonwitch Glass touch controls
        shell: bash
        run: python3 .github/scripts/apply_moonwitch_transparent_overlay.py

      - name: Apply Vulkan vertex binding optimization
        shell: bash
        run: |
          python3 .github/scripts/apply_vulkan_vertex_binding_perf.py
          grep -q "SetVertexInputDynamicState" src/video_core/renderer_vulkan/vk_buffer_cache.h
          grep -q "vertex_input_dynamic_state_active" src/video_core/renderer_vulkan/vk_buffer_cache.h
          grep -q "!vertex_input_dynamic_state_active" src/video_core/renderer_vulkan/vk_buffer_cache.cpp
          grep -q "SetVertexInputDynamicState(HasDynamicVertexInput())" src/video_core/renderer_vulkan/vk_graphics_pipeline.h

      - name: Apply Moonwitch Reconstruction Stage 2
        shell: bash
        run: |
          python3 .github/scripts/apply_moonwitch_reconstruction_stage2.py
          grep -q "Moonwitch Reconstruction Stage 2" src/video_core/renderer_vulkan/present/layer.cpp
          grep -q "target_scale > render_scale" src/video_core/renderer_vulkan/present/layer.cpp
          grep -q "sr_filter.emplace<SGSR>(device, memory_allocator, image_count, output_size, true)" src/video_core/renderer_vulkan/present/layer.cpp
          git diff --check

      - name: Apply Moonwitch Color Grading
        shell: bash
        run: |
          python3 .github/scripts/apply_moonwitch_color_grading.py
          grep -q "moonwitch_color_grading_mode" src/common/settings.h
          grep -q "class MoonwitchColorGrading final" src/video_core/renderer_vulkan/present/color_grading.h
          grep -q "MOONWITCH_COLOR_GRADING_MODE" src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/model/IntSetting.kt
          grep -q "moonwitchColorGradingNames" src/android/app/src/main/res/values/arrays.xml
          grep -q "moonwitch_color_grading.frag" src/video_core/host_shaders/CMakeLists.txt
          grep -q "mode == 8" src/video_core/host_shaders/moonwitch_color_grading.frag
          grep -q "mw_color_grading_hdr_plus" src/android/app/src/main/res/values/arrays.xml
          grep -q "IntSetting.MOONWITCH_COLOR_GRADING_MODE" src/android/app/src/main/java/org/yuzu/yuzu_emu/fragments/EmulationFragment.kt
          grep -q "IntSetting.MOONWITCH_COLOR_GRADING_STRENGTH" src/android/app/src/main/java/org/yuzu/yuzu_emu/fragments/EmulationFragment.kt
          git diff --check

      - name: Apply Moonwitch Safe GPU Barriers core
        shell: bash
        run: |
          python3 .github/scripts/apply_moonwitch_safe_gpu_barriers_core.py
          grep -q "moonwitch_safe_gpu_barriers_mode" src/common/settings.h
          grep -q "ApplyMoonwitchGpuBarrier" src/video_core/renderer_vulkan/vk_rasterizer.cpp
          grep -q "VK_PIPELINE_STAGE_ALL_COMMANDS_BIT" src/video_core/renderer_vulkan/vk_rasterizer.cpp
          grep -q "VK_DEPENDENCY_BY_REGION_BIT" src/video_core/renderer_vulkan/vk_rasterizer.cpp
          git diff --check

      - name: Apply Moonwitch Safe GPU Barriers Android UI
        shell: bash
        run: |
          python3 .github/scripts/apply_moonwitch_safe_gpu_barriers_android.py
          grep -q "MOONWITCH_SAFE_GPU_BARRIERS_MODE" src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/model/IntSetting.kt
          grep -q "moonwitchSafeGpuBarrierNames" src/android/app/src/main/res/values/arrays.xml
          grep -q "IntSetting.MOONWITCH_SAFE_GPU_BARRIERS_MODE" src/android/app/src/main/java/org/yuzu/yuzu_emu/fragments/EmulationFragment.kt
          grep -q "mw_graphics_fixes_header" src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/ui/SettingsFragmentPresenter.kt
          git diff --check

      - name: Apply Moonwitch Render Target Guard core
        shell: bash
        run: |
          python3 .github/scripts/apply_moonwitch_render_target_guard_core.py
          grep -q "moonwitch_render_target_init_alias_guard" src/common/settings.h
          grep -q "ApplyRenderTargetInitAliasGuard" src/video_core/texture_cache/texture_cache.h
          grep -q "ApplyRenderTargetInitAliasGuard" src/video_core/renderer_vulkan/vk_texture_cache.cpp
          grep -q "moonwitch_rt_alias_barriers" src/video_core/renderer_vulkan/vk_texture_cache.h
          grep -q "ApplyRenderTargetInitAliasGuard" src/video_core/renderer_opengl/gl_texture_cache.h
          git diff --check

      - name: Apply Moonwitch Render Target Guard Android UI
        shell: bash
        run: |
          python3 .github/scripts/apply_moonwitch_render_target_guard_android.py
          grep -q "MOONWITCH_RENDER_TARGET_INIT_ALIAS_GUARD" src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/model/BooleanSetting.kt
          grep -q "mw_render_target_guard_title" src/android/app/src/main/res/values/strings.xml
          grep -q "BooleanSetting.MOONWITCH_RENDER_TARGET_INIT_ALIAS_GUARD" src/android/app/src/main/java/org/yuzu/yuzu_emu/fragments/EmulationFragment.kt
          grep -q "MOONWITCH_RENDER_TARGET_INIT_ALIAS_GUARD.key" src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/ui/SettingsFragmentPresenter.kt
          git diff --check

      - name: Apply Moonwitch Texture Coherency core
        shell: bash
        run: |
          python3 .github/scripts/apply_moonwitch_texture_coherency_core.py
          grep -q "moonwitch_texture_coherency" src/common/settings.h
          grep -q "runtime.ApplyTextureCoherency" src/video_core/texture_cache/texture_cache.h
          grep -q "NeedsMoonwitchTextureCoherency" src/video_core/renderer_vulkan/vk_texture_cache.h
          grep -q "Moonwitch Texture Coherency enabled" src/video_core/renderer_vulkan/vk_texture_cache.cpp
          grep -q "VK_ACCESS_SHADER_READ_BIT" src/video_core/renderer_vulkan/vk_texture_cache.cpp
          grep -q "ApplyTextureCoherency" src/video_core/renderer_opengl/gl_texture_cache.h
          git diff --check

      - name: Apply Moonwitch Texture Coherency Android UI
        shell: bash
        run: |
          python3 .github/scripts/apply_moonwitch_texture_coherency_android.py
          grep -q "MOONWITCH_TEXTURE_COHERENCY" src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/model/BooleanSetting.kt
          grep -q "mw_texture_coherency_title" src/android/app/src/main/res/values/strings.xml
          grep -q "BooleanSetting.MOONWITCH_TEXTURE_COHERENCY" src/android/app/src/main/java/org/yuzu/yuzu_emu/fragments/EmulationFragment.kt
          grep -q "MOONWITCH_TEXTURE_COHERENCY.key" src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/ui/SettingsFragmentPresenter.kt
          git diff --check

      - name: Apply Moonwitch Selective Shader Precision core
        shell: bash
        run: |
          python3 .github/scripts/apply_moonwitch_shader_precision_core.py
          grep -Fq "moonwitch_shader_precision_mode" src/common/settings.h
          grep -Fq "ShouldForceNoContraction" src/shader_recompiler/backend/spirv/emit_spirv_floating_point.cpp
          grep -Fq "ShouldKeepRelaxedPrecision" src/shader_recompiler/backend/spirv/emit_spirv_image.cpp
          grep -Fq "sizeof(moonwitch_shader_precision_mode)" src/video_core/renderer_vulkan/vk_graphics_pipeline.h
          grep -Fq ".moonwitch_shader_precision_mode = CurrentShaderPrecisionMode()" src/video_core/renderer_vulkan/vk_pipeline_cache.cpp
          grep -Fq "constexpr u32 CACHE_VERSION = 19" src/video_core/renderer_vulkan/vk_pipeline_cache.cpp
          git diff --check

      - name: Apply Moonwitch Selective Shader Precision Android UI
        shell: bash
        run: |
          python3 .github/scripts/apply_moonwitch_shader_precision_android.py
          grep -Fq "MOONWITCH_SHADER_PRECISION_MODE" src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/model/IntSetting.kt
          grep -Fq "moonwitchShaderPrecisionNames" src/android/app/src/main/res/values/arrays.xml
          grep -Fq "IntSetting.MOONWITCH_SHADER_PRECISION_MODE" src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/model/view/SettingsItem.kt
          grep -Fq "MOONWITCH_SHADER_PRECISION_MODE.key" src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/ui/SettingsFragmentPresenter.kt
          grep -Fq "IntSetting.MOONWITCH_SHADER_PRECISION_MODE" src/android/app/src/main/java/org/yuzu/yuzu_emu/fragments/EmulationFragment.kt
          git diff --check

      - name: Apply Moonwitch Maximum Compatibility core
        shell: bash
        run: |
          python3 .github/scripts/apply_moonwitch_maximum_compatibility_core.py
          grep -Fq "moonwitch_maximum_compatibility" src/common/settings.h
          grep -Fq "maximum_compatibility" src/video_core/renderer_vulkan/vk_rasterizer.cpp
          grep -Fq "maximum_compatibility" src/video_core/texture_cache/texture_cache.h
          grep -Fq "moonwitch_maximum_compatibility.GetValue()" src/video_core/renderer_vulkan/vk_pipeline_cache.cpp
          grep -Fq "return 2;" src/video_core/renderer_vulkan/vk_pipeline_cache.cpp
          git diff --check

      - name: Apply Moonwitch Maximum Compatibility Android UI
        shell: bash
        run: |
          python3 .github/scripts/apply_moonwitch_maximum_compatibility_android.py
          grep -Fq "MOONWITCH_MAXIMUM_COMPATIBILITY" src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/model/BooleanSetting.kt
          grep -Fq "mw_maximum_compatibility_title" src/android/app/src/main/res/values/strings.xml
          grep -Fq "BooleanSetting.MOONWITCH_MAXIMUM_COMPATIBILITY" src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/model/view/SettingsItem.kt
          grep -Fq "MOONWITCH_MAXIMUM_COMPATIBILITY.key" src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/ui/SettingsFragmentPresenter.kt
          grep -Fq "BooleanSetting.MOONWITCH_MAXIMUM_COMPATIBILITY" src/android/app/src/main/java/org/yuzu/yuzu_emu/fragments/EmulationFragment.kt
          git diff --check

      - name: Apply Moonwitch Unleashed core
        shell: bash
        run: |
          python3 .github/scripts/apply_moonwitch_unleashed_core.py
          grep -Fq "moonwitch_unleashed" src/common/settings.h
          grep -Fq "SYS_sched_setattr" src/common/moonwitch_unleashed.cpp
          grep -Fq "BASE_UTIL_MIN = 768" src/common/moonwitch_unleashed.cpp
          grep -Fq "BURST_UTIL_MIN = 922" src/common/moonwitch_unleashed.cpp
          grep -Fq "ThreadRole::CPUCore" src/core/cpu_manager.cpp
          grep -Fq "ThreadRole::GPU" src/video_core/gpu_thread.cpp
          grep -Fq "ThreadRole::VulkanWorker" src/video_core/renderer_vulkan/vk_scheduler.cpp
          grep -Fq "MoonwitchUnleashed::EndSession" src/core/core.cpp
          git diff --check

      - name: Apply Moonwitch Unleashed Android UI
        shell: bash
        run: |
          python3 .github/scripts/apply_moonwitch_unleashed_android.py
          grep -Fq "MOONWITCH_UNLEASHED" src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/model/BooleanSetting.kt
          grep -Fq "SECTION_MOONWITCH_UNLEASHED" src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/model/Settings.kt
          grep -Fq "unleashedAppliedThreads" src/android/app/src/main/java/org/yuzu/yuzu_emu/utils/PerformanceLabNative.kt
          grep -Fq "UNLEASHED | PARTIAL" src/android/app/src/main/java/org/yuzu/yuzu_emu/views/PerformanceLabOverlayView.kt
          grep -Fq "BooleanSetting.MOONWITCH_UNLEASHED" src/android/app/src/main/java/org/yuzu/yuzu_emu/fragments/EmulationFragment.kt
          git diff --check

      - name: Apply Moonwitch Core Director core
        shell: bash
        run: |
          python3 .github/scripts/apply_moonwitch_core_director_core.py
          grep -Fq "moonwitch_core_director" src/common/settings.h
          grep -Fq "DetectSnapdragon" src/common/moonwitch_core_director.cpp
          grep -Fq "sched_setaffinity" src/common/moonwitch_core_director.cpp
          grep -Fq "MINIMUM_PERFORMANCE_CORES = 4" src/common/moonwitch_core_director.cpp
          grep -Fq "MoonwitchCoreDirector::ThreadRole::CPUCore" src/core/cpu_manager.cpp
          grep -Fq "MoonwitchCoreDirector::ThreadRole::GPU" src/video_core/gpu_thread.cpp
          grep -Fq "MoonwitchCoreDirector::ThreadRole::VulkanWorker" src/video_core/renderer_vulkan/vk_scheduler.cpp
          grep -Fq "MoonwitchCoreDirector::Maintain" src/core/perf_stats.cpp
          grep -Fq "MoonwitchCoreDirector::EndSession" src/core/core.cpp
          git diff --check

      - name: Apply Moonwitch Core Director Android UI
        shell: bash
        run: |
          python3 .github/scripts/apply_moonwitch_core_director_android.py
          grep -Fq "MOONWITCH_CORE_DIRECTOR" src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/model/BooleanSetting.kt
          grep -Fq "SECTION_MOONWITCH_CORE_DIRECTOR" src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/model/Settings.kt
          grep -Fq "coreDirectorAppliedThreads" src/android/app/src/main/java/org/yuzu/yuzu_emu/utils/PerformanceLabNative.kt
          grep -Fq "CORE DIRECTOR | ACTIVE" src/android/app/src/main/java/org/yuzu/yuzu_emu/views/PerformanceLabOverlayView.kt
          grep -Fq "BooleanSetting.MOONWITCH_CORE_DIRECTOR" src/android/app/src/main/java/org/yuzu/yuzu_emu/fragments/EmulationFragment.kt
          git diff --check

      - name: Configure Gradle properties
        shell: bash
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties
          printf '%s\n' 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          printf '%s\n' 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties

      - name: Install Android dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          command -v glslangValidator
          glslangValidator --version | head -n 2

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            for candidate in \
              "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" \
              "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" \
              "${ANDROID_HOME:-}/tools/bin/sdkmanager"; do
              if [[ -x "$candidate" ]]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/opt/android-sdk}" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found on runner"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Build mainline release
        shell: bash
        run: |
          cd src/android
          ./gradlew --no-daemon --stacktrace assembleMainlineRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOONWITCH-CORE-DIRECTOR-V2
          path: src/android/app/build/outputs/apk/mainline/release/app-mainline-release.apk
          if-no-files-found: error
