name: Moonwitch Reconstruction Stage 2

on:
  workflow_dispatch:
  push:
    branches:
      - exp/moonwitch-reconstruction-stage2

permissions:
  contents: write

concurrency:
  group: moonwitch-reconstruction-stage2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Apply Moonwitch Reconstruction Stage 2
        shell: bash
        run: |
          python3 .github/scripts/apply_moonwitch_reconstruction_stage2.py

      - name: Guard TOTK foliage workaround
        shell: bash
        run: |
          if ! grep -q "TOTK_PROGRAM_ID" src/video_core/renderer_vulkan/vk_rasterizer.cpp; then
            echo "TOTK foliage workaround is missing; refusing to build."
            exit 1
          fi
          if ! git diff --quiet -- src/video_core/renderer_vulkan/vk_rasterizer.cpp; then
            echo "Reconstruction patch touched vk_rasterizer.cpp; refusing to build."
            git diff -- src/video_core/renderer_vulkan/vk_rasterizer.cpp
            exit 1
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Validate Qualcomm SGSR2 compute shaders
        shell: bash
        run: |
          for shader in \
            src/video_core/host_shaders/sgsr2_convert.comp \
            src/video_core/host_shaders/sgsr2_activate.comp \
            src/video_core/host_shaders/sgsr2_upscale.comp; do
            echo "Validating $shader"
            glslangValidator -V --target-env spirv1.3 "$shader" -o "/tmp/$(basename "$shader").spv"
            spirv-val --target-env spv1.3 "/tmp/$(basename "$shader").spv"
          done

      - name: Build
        shell: bash
        env:
          CCACHE: 'false'
        run: |
          chmod +x .ci/android/build.sh src/android/gradlew
          .ci/android/build.sh -t standard -b Release

      - name: Persist validated Stage 2 sources
        if: success()
        shell: bash
        run: |
          git config user.name "Moonwitch CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/video_core/CMakeLists.txt \
            src/video_core/host_shaders/CMakeLists.txt \
            src/video_core/host_shaders/sgsr2_convert.comp \
            src/video_core/host_shaders/sgsr2_activate.comp \
            src/video_core/host_shaders/sgsr2_upscale.comp \
            src/video_core/renderer_vulkan/present/sgsr2_resources.cpp \
            src/video_core/renderer_vulkan/present/sgsr2_resources.h
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] feat(reconstruction): stage2 SGSR2 temporal resource backbone"
            git push origin HEAD:exp/moonwitch-reconstruction-stage2
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOONWITCH-RECONSTRUCTION-STAGE2
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 7
