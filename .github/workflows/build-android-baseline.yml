name: Moonwitch Stage 10 + Classic UI

on:
  workflow_dispatch:
  push:
    branches:
      - exp/moonwitch-reconstruction-stage9
      - feat/stage9-frontend-ui
      - feat/stage9-ui-exact
      - feat/stage9-classic-ui
      - exp/moonwitch-reconstruction-stage10-classic-ui

permissions:
  actions: read
  contents: write

concurrency:
  group: moonwitch-stage10-classic-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2

      - name: Capture V2 build 162 failure and self-clean
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/100845628178/logs" \
            -o /tmp/v2-job.log
          {
            echo "Moonwitch V2 build #162 diagnostic"
            echo
            grep -Ei -C 5 'error:|e: |FAILURE:|AAPT|resource .* not found|unresolved reference|type mismatch|cannot find symbol|does not contain a declaration|Execution failed for task' /tmp/v2-job.log | tail -n 260 || true
          } > .github/v2-build-error.txt
          git config user.name "Moonwitch CI"
          git config user.email "actions@users.noreply.github.com"
          git show HEAD^:.github/workflows/build-android-baseline.yml > .github/workflows/build-android-baseline.yml
          git rm -f .github/workflows/moonwitch-v2-log-dump.yml || true
          git add .github/v2-build-error.txt .github/workflows/build-android-baseline.yml
          git commit -m "ci: capture V2 build failure diagnostic"
          git push origin HEAD:exp/moonwitch-reconstruction-stage10-classic-ui
          exit 0

      - name: Apply Moonwitch Reconstruction Stage 2
        shell: bash
        run: python3 .github/scripts/apply_moonwitch_reconstruction_stage2.py

      - name: Apply Moonwitch Reconstruction Stage 3
        shell: bash
        run: python3 .github/scripts/apply_moonwitch_reconstruction_stage3.py

      - name: Apply Moonwitch Reconstruction Stage 4
        shell: bash
        run: python3 .github/scripts/apply_moonwitch_reconstruction_stage4.py

      - name: Apply Moonwitch Reconstruction Stage 5
        shell: bash
        run: python3 .github/scripts/apply_moonwitch_reconstruction_stage5.py

      - name: Apply Moonwitch Reconstruction Stage 6
        shell: bash
        run: python3 .github/scripts/apply_moonwitch_reconstruction_stage6.py

      - name: Apply Moonwitch Reconstruction Stage 7
        shell: bash
        run: python3 .github/scripts/apply_moonwitch_reconstruction_stage7.py

      - name: Apply Moonwitch Reconstruction Stage 8
        shell: bash
        run: python3 .github/scripts/apply_moonwitch_reconstruction_stage8_runner.py

      - name: Apply Moonwitch Reconstruction Stage 9
        shell: bash
        run: python3 .github/scripts/apply_moonwitch_reconstruction_stage9.py

      - name: Apply Moonwitch Reconstruction Stage 10
        shell: bash
        run: python3 .github/scripts/apply_moonwitch_reconstruction_stage10.py

      - name: Guard Stage 10 integrity and TOTK foliage workaround
        shell: bash
        run: |
          if ! grep -q "TOTK_PROGRAM_ID" src/video_core/renderer_vulkan/vk_rasterizer.cpp; then
            echo "TOTK foliage workaround is missing; refusing to build."
            exit 1
          fi
          if ! git diff --quiet -- src/video_core/renderer_vulkan/vk_rasterizer.cpp; then
            echo "Reconstruction patch touched vk_rasterizer.cpp; refusing to build."
            git diff -- src/video_core/renderer_vulkan/vk_rasterizer.cpp
            exit 1
          fi
          grep -q "SGSR2_SCENE_HISTORY_CAPACITY" src/video_core/renderer_vulkan/vk_texture_cache.h
          grep -q "SGSR2FindSceneHistory" src/video_core/renderer_vulkan/vk_texture_cache.cpp
          grep -q "SGSR2RecordImageLineage" src/video_core/renderer_vulkan/vk_texture_cache.cpp
          grep -q "GPUVAddr gpu_addr" src/video_core/renderer_vulkan/vk_texture_cache.h
          grep -q "guest_address_match" src/video_core/renderer_vulkan/vk_texture_cache.h
          grep -q "guest_address_correlated" src/video_core/renderer_vulkan/vk_rasterizer.h
          grep -q "depth_guest_address_correlated" src/video_core/renderer_vulkan/present/sgsr2_runtime_inputs.h
          grep -q "guest_addr_match" src/video_core/renderer_vulkan/present/layer.cpp
          grep -q "motion_scene_history_evidence" src/video_core/renderer_vulkan/present/sgsr2_runtime_inputs.h
          grep -q "Stage 9 intentionally keeps motion_valid false" src/video_core/renderer_vulkan/present/layer.cpp
          grep -q "ReadyForTemporalDispatch" src/video_core/renderer_vulkan/present/sgsr2_runtime_inputs.h
          if grep -Eq "sgsr2_inputs\.motion_valid[[:space:]]*=[[:space:]]*true" src/video_core/renderer_vulkan/present/layer.cpp; then
            echo "Stage 10 attempted to promote unverified motion data; refusing to build."
            exit 1
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Validate Qualcomm SGSR2 compute shaders
        shell: bash
        run: |
          for shader in \
            src/video_core/host_shaders/sgsr2_convert.comp \
            src/video_core/host_shaders/sgsr2_activate.comp \
            src/video_core/host_shaders/sgsr2_upscale.comp; do
            echo "Validating $shader"
            glslangValidator -V --target-env spirv1.3 "$shader" -o "/tmp/$(basename "$shader").spv"
            spirv-val --target-env spv1.3 "/tmp/$(basename "$shader").spv"
          done

      - name: Validate classic UI and current feature wiring
        shell: bash
        run: |
          grep -q "updateButtonsVisibility" src/android/app/src/main/java/org/yuzu/yuzu_emu/ui/GamesFragment.kt
          grep -q "filter_favorites" src/android/app/src/main/java/org/yuzu/yuzu_emu/ui/GamesFragment.kt
          grep -q "SECTION_MOONWITCH_PERFORMANCE" src/android/app/src/main/java/org/yuzu/yuzu_emu/fragments/HomeSettingsFragment.kt
          grep -q '@+id/settings_button' src/android/app/src/main/res/layout/fragment_games.xml
          grep -q '@+id/launch_qlaunch' src/android/app/src/main/res/layout/fragment_games.xml
          if grep -q '@+id/bottom_nav' src/android/app/src/main/res/layout/fragment_games.xml; then
            echo "Modern bottom navigation is present in the classic frontend; refusing to build."
            exit 1
          fi
          git diff --check

      - name: Build
        shell: bash
        env:
          CCACHE: 'false'
        run: |
          chmod +x .ci/android/build.sh src/android/gradlew
          .ci/android/build.sh -t standard -b Release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOONWITCH-STAGE10-CLASSIC-UI
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Validate generated Stage 10 sources
        shell: bash
        run: |
          git diff --check
          for file in \
            src/video_core/host_shaders/sgsr2_convert.comp \
            src/video_core/host_shaders/sgsr2_activate.comp \
            src/video_core/host_shaders/sgsr2_upscale.comp \
            src/video_core/renderer_vulkan/present/sgsr2_resources.cpp \
            src/video_core/renderer_vulkan/present/sgsr2_resources.h \
            src/video_core/renderer_vulkan/present/sgsr2_runtime_inputs.h \
            src/video_core/renderer_vulkan/present/sgsr2_motion_probe.cpp \
            src/video_core/renderer_vulkan/present/sgsr2_motion_probe.h \
            src/video_core/renderer_vulkan/present/layer.cpp \
            src/video_core/renderer_vulkan/present/layer.h \
            src/video_core/renderer_vulkan/vk_texture_cache.cpp \
            src/video_core/renderer_vulkan/vk_texture_cache.h \
            src/video_core/renderer_vulkan/vk_rasterizer.h; do
            test -s "$file" || { echo "Missing generated file: $file"; exit 1; }
          done
