name: Moonwitch Home Frontend V1 Compile Fix

on:
  push:
    branches:
      - work/home-frontend-v1

permissions:
  contents: write

concurrency:
  group: moonwitch-home-frontend-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply compile fix and restore canonical workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_home_frontend_scroll.py
          grep -q 'is LinearLayoutManager -> {' src/android/app/src/main/java/org/yuzu/yuzu_emu/ui/GamesFragment.kt
          if grep -q 'else lm.findFirstVisibleItemPosition()' src/android/app/src/main/java/org/yuzu/yuzu_emu/ui/GamesFragment.kt; then
            echo 'Malformed hero selector is still present'
            exit 1
          fi
          git config user.name "Moonwitch CI"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin exp/moonwitch-reconstruction-stage10-classic-ui
          git checkout origin/exp/moonwitch-reconstruction-stage10-classic-ui -- .github/workflows/build-android-baseline.yml
          git rm .github/scripts/fix_home_frontend_scroll.py
          git add src/android/app/src/main/java/org/yuzu/yuzu_emu/ui/GamesFragment.kt .github/workflows/build-android-baseline.yml
          git diff --cached --check
          git commit -m "Moonwitch: fix Home Frontend hero scroll compilation [skip ci]"
          git push origin HEAD:work/home-frontend-v1
