name: Moonwitch V1.2 Performance Preview

on:
  workflow_dispatch:
  push:
    branches:
      - perf/moonwitch-v1.2

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply CAS patch
        shell: bash
        run: |
          cat .github/scripts/apply_cas.part{1..6} > /tmp/apply_cas.py
          python3 -m py_compile /tmp/apply_cas.py
          python3 /tmp/apply_cas.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Build
        shell: bash
        env:
          CCACHE: 'false'
        run: |
          chmod +x .ci/android/build.sh src/android/gradlew
          .ci/android/build.sh -t standard -b Release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOONWITCH-V1-2-PERF-PREVIEW
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 7
