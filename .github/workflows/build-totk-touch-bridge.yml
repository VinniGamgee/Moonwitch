name: TOTK Direct Touch Camera Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - exp/moonwitch-reference-layout-build200
    paths:
      - .github/workflows/build-totk-touch-bridge.yml
      - .github/scripts/**

permissions:
  contents: read

jobs:
  build-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Build direct memory-to-camera bridge v2
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH="$DEVKITPRO/tools/bin:$DEVKITA64/bin:$PATH"

          git clone --depth 1 https://github.com/mcrib884/totk-mousecam.git /tmp/totk-touch-bridge

          cat > /tmp/totk-touch-bridge/mod/source/program/main.cpp <<'CPP'
          #include "lib.hpp"
          #include "loggers.hpp"
          #include <cmath>
          #include <cstdint>

          namespace MoonwitchTouchCamera {
          constexpr std::uint64_t MAGIC_A = 0x3245474449524254ULL; // "TBRIDGE2"
          constexpr std::uint64_t MAGIC_B = 0x324D41434354574DULL; // "MWTCCAM2"
          constexpr std::uint32_t VERSION = 2;
          constexpr float SensitivityX = 0.0045f;
          constexpr float SensitivityY = 0.0045f;
          constexpr float PitchLimit = 1.45f;

          #pragma pack(push, 1)
          struct BridgePacket {
              std::uint64_t magic_a;
              std::uint64_t magic_b;
              std::uint32_t version;
              std::uint32_t sequence;
              float total_x;
              float total_y;
              std::uint32_t enabled;
              std::uint32_t reserved;
          };
          #pragma pack(pop)
          static_assert(sizeof(BridgePacket) == 40);

          // Moonwitch scans guest module-data pages for this unique packet and writes the raw
          // cumulative MotionEvent deltas directly here. No HID activation and no gamepad path.
          alignas(64) static volatile BridgePacket g_bridge = {
              MAGIC_A, MAGIC_B, VERSION, 0, 0.0f, 0.0f, 0, 0
          };

          static bool first_read = true;
          static float last_total_x = 0.0f;
          static float last_total_y = 0.0f;
          static std::uint32_t last_sequence = 0;

          static bool ReadRelativeDelta(float& dx, float& dy) {
              const std::uint64_t magic_a = g_bridge.magic_a;
              const std::uint64_t magic_b = g_bridge.magic_b;
              const std::uint32_t version = g_bridge.version;
              const std::uint32_t sequence = g_bridge.sequence;
              const float total_x = g_bridge.total_x;
              const float total_y = g_bridge.total_y;
              const std::uint32_t enabled = g_bridge.enabled;

              if (magic_a != MAGIC_A || magic_b != MAGIC_B || version != VERSION || enabled == 0) {
                  first_read = true;
                  dx = 0.0f;
                  dy = 0.0f;
                  return false;
              }

              if (first_read) {
                  first_read = false;
                  last_total_x = total_x;
                  last_total_y = total_y;
                  last_sequence = sequence;
                  dx = 0.0f;
                  dy = 0.0f;
                  return false;
              }

              if (sequence == last_sequence) {
                  dx = 0.0f;
                  dy = 0.0f;
                  return false;
              }

              dx = total_x - last_total_x;
              dy = total_y - last_total_y;
              last_total_x = total_x;
              last_total_y = total_y;
              last_sequence = sequence;
              return dx != 0.0f || dy != 0.0f;
          }

          static void ApplyRelativeLook(long* camera_ptr) {
              if (camera_ptr == nullptr || reinterpret_cast<std::uintptr_t>(camera_ptr) < 0x1000) {
                  return;
              }

              const auto camera_data = static_cast<std::uintptr_t>(*camera_ptr);
              if (camera_data < 0x1000) {
                  return;
              }

              float dx = 0.0f;
              float dy = 0.0f;
              if (!ReadRelativeDelta(dx, dy)) {
                  return;
              }

              auto* pos_x = reinterpret_cast<float*>(camera_data + 0x00);
              auto* pos_y = reinterpret_cast<float*>(camera_data + 0x04);
              auto* pos_z = reinterpret_cast<float*>(camera_data + 0x08);
              auto* foc_x = reinterpret_cast<float*>(camera_data + 0x0C);
              auto* foc_y = reinterpret_cast<float*>(camera_data + 0x10);
              auto* foc_z = reinterpret_cast<float*>(camera_data + 0x14);
              auto* up_x  = reinterpret_cast<float*>(camera_data + 0x18);
              auto* up_y  = reinterpret_cast<float*>(camera_data + 0x1C);
              auto* up_z  = reinterpret_cast<float*>(camera_data + 0x20);

              const float fx = *foc_x;
              const float fy = *foc_y;
              const float fz = *foc_z;
              const float vx = *pos_x - fx;
              const float vy = *pos_y - fy;
              const float vz = *pos_z - fz;
              const float radius = std::sqrt(vx * vx + vy * vy + vz * vz);
              if (!std::isfinite(radius) || radius < 0.10f) {
                  return;
              }

              float yaw = std::atan2(vx, vz);
              float pitch = std::asin(vy / radius);
              if (!std::isfinite(yaw) || !std::isfinite(pitch)) {
                  return;
              }

              // True relative touch-look: every finger delta adds directly to yaw/pitch.
              yaw -= dx * SensitivityX;
              pitch += dy * SensitivityY;
              if (pitch > PitchLimit) pitch = PitchLimit;
              if (pitch < -PitchLimit) pitch = -PitchLimit;

              const float horizontal = radius * std::cos(pitch);
              *pos_x = fx + horizontal * std::sin(yaw);
              *pos_y = fy + radius * std::sin(pitch);
              *pos_z = fz + horizontal * std::cos(yaw);
              *up_x = 0.0f;
              *up_y = 1.0f;
              *up_z = 0.0f;
          }
          } // namespace MoonwitchTouchCamera

          // Camera update used by the current MouseCam implementation for the 1.4.x target.
          constexpr std::uintptr_t CAMERA_UPDATE = 0x00A70604;

          HOOK_DEFINE_TRAMPOLINE(MoonwitchDirectTouchCameraHook) {
              static void Callback(float delta_time, long param2, long* camera_ptr) {
                  Orig(delta_time, param2, camera_ptr);
                  MoonwitchTouchCamera::ApplyRelativeLook(camera_ptr);
              }
          };

          extern "C" void exl_main(void*, void*) {
              exl::hook::Initialize();
              MoonwitchDirectTouchCameraHook::InstallAtOffset(CAMERA_UPDATE);
              Logging.Log("Moonwitch Touch Camera v2: guest memory delta -> camera yaw/pitch");
          }

          extern "C" NORETURN void exl_exception_entry() {
              EXL_ABORT("Moonwitch TOTK touch camera v2 exception");
          }
          CPP

          if grep -Eq 'AnalogStickR|RightStick|menuStick|GetNpadState|GetNpadStates|InitializeMouse|GetMouseState' /tmp/totk-touch-bridge/mod/source/program/main.cpp; then
            echo 'Forbidden HID/gamepad camera path detected in bridge v2.'
            exit 1
          fi
          grep -q 'TBRIDGE2' /tmp/totk-touch-bridge/mod/source/program/main.cpp
          grep -q 'MWTCCAM2' /tmp/totk-touch-bridge/mod/source/program/main.cpp

          cd /tmp/totk-touch-bridge/mod
          make clean
          make -j2

          test -f deploy/totk-mousecam/exefs/subsdk8
          mkdir -p /tmp/out/Moonwitch-TOTK-Direct-Touch-Camera-v2/exefs
          cp deploy/totk-mousecam/exefs/subsdk8 /tmp/out/Moonwitch-TOTK-Direct-Touch-Camera-v2/exefs/
          cat > /tmp/out/Moonwitch-TOTK-Direct-Touch-Camera-v2/README.txt <<'TXT'
          Moonwitch TOTK Direct Touch Camera bridge v2

          This build removes the guest HID mouse dependency from the TOTK adapter.
          Pipeline:
          Android MotionEvent relative delta -> Moonwitch host TouchLook -> guest bridge memory -> camera yaw/pitch.

          There is no R-Stick mapping, no virtual joystick center/radius and no analog magnitude.
          Use together with the matching Moonwitch APK containing TouchLook guest bridge v2.
          TXT
          cd /tmp/out
          zip -r /tmp/Moonwitch-TOTK-Direct-Touch-Camera-v2.zip Moonwitch-TOTK-Direct-Touch-Camera-v2

      - name: Upload TOTK bridge v2
        uses: actions/upload-artifact@v4
        with:
          name: MOONWITCH-TOTK-DIRECT-TOUCH-CAMERA-V2
          path: /tmp/Moonwitch-TOTK-Direct-Touch-Camera-v2.zip
          if-no-files-found: error
          retention-days: 7
