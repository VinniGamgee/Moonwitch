name: TOTK Direct Touch Camera Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - exp/moonwitch-reference-layout-build200
    paths:
      - .github/workflows/build-totk-touch-bridge.yml
      - .github/scripts/**

permissions:
  contents: read

jobs:
  build-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Build direct HID-to-camera bridge
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH="$DEVKITPRO/tools/bin:$DEVKITA64/bin:$PATH"

          git clone --depth 1 https://github.com/mcrib884/totk-mousecam.git /tmp/totk-touch-bridge

          cat > /tmp/totk-touch-bridge/mod/source/program/main.cpp <<'CPP'
          #include "lib.hpp"
          #include "loggers.hpp"
          #include <cmath>
          #include <cstdint>

          // Keep the bridge independent from the project's legacy nx/types.h include tree.
          // These declarations match nn::hid::MouseState's ABI: 8-byte sample + eight 32-bit words.
          namespace nn::hid {
          struct MouseState {
              std::uint64_t samplingNumber;
              std::int32_t x;
              std::int32_t y;
              std::int32_t deltaX;
              std::int32_t deltaY;
              std::int32_t wheelDeltaX;
              std::int32_t wheelDeltaY;
              std::int32_t buttons;
              std::int32_t attributes;
          };
          static_assert(sizeof(MouseState) == 40);
          void InitializeMouse();
          void GetMouseState(MouseState* state);
          } // namespace nn::hid

          namespace MoonwitchTouchCamera {
          constexpr float SensitivityX = 0.0045f;
          constexpr float SensitivityY = 0.0045f;
          constexpr float PitchLimit = 1.45f;

          static std::uint64_t last_mouse_sample = 0;
          static bool mouse_initialized = false;

          static void InitializeMouseOnce() {
              if (!mouse_initialized) {
                  nn::hid::InitializeMouse();
                  mouse_initialized = true;
              }
          }

          static bool ReadRelativeDelta(float& dx, float& dy) {
              InitializeMouseOnce();
              nn::hid::MouseState state{};
              nn::hid::GetMouseState(&state);

              if (state.samplingNumber == 0 || state.samplingNumber == last_mouse_sample) {
                  dx = 0.0f;
                  dy = 0.0f;
                  return false;
              }

              last_mouse_sample = state.samplingNumber;
              dx = static_cast<float>(state.deltaX);
              dy = static_cast<float>(state.deltaY);
              return dx != 0.0f || dy != 0.0f;
          }

          static void ApplyRelativeLook(long* camera_ptr) {
              if (camera_ptr == nullptr || reinterpret_cast<std::uintptr_t>(camera_ptr) < 0x1000) {
                  return;
              }

              const auto camera_data = static_cast<std::uintptr_t>(*camera_ptr);
              if (camera_data < 0x1000) {
                  return;
              }

              float dx = 0.0f;
              float dy = 0.0f;
              if (!ReadRelativeDelta(dx, dy)) {
                  return;
              }

              auto* pos_x = reinterpret_cast<float*>(camera_data + 0x00);
              auto* pos_y = reinterpret_cast<float*>(camera_data + 0x04);
              auto* pos_z = reinterpret_cast<float*>(camera_data + 0x08);
              auto* foc_x = reinterpret_cast<float*>(camera_data + 0x0C);
              auto* foc_y = reinterpret_cast<float*>(camera_data + 0x10);
              auto* foc_z = reinterpret_cast<float*>(camera_data + 0x14);
              auto* up_x  = reinterpret_cast<float*>(camera_data + 0x18);
              auto* up_y  = reinterpret_cast<float*>(camera_data + 0x1C);
              auto* up_z  = reinterpret_cast<float*>(camera_data + 0x20);

              const float fx = *foc_x;
              const float fy = *foc_y;
              const float fz = *foc_z;
              const float vx = *pos_x - fx;
              const float vy = *pos_y - fy;
              const float vz = *pos_z - fz;
              const float radius = std::sqrt(vx * vx + vy * vy + vz * vz);

              if (!std::isfinite(radius) || radius < 0.10f) {
                  return;
              }

              // Add the finger's relative delta to the camera TOTK generated this frame.
              // No joystick center, radius, deadzone or analog magnitude exists in this path.
              float yaw = std::atan2(vx, vz);
              float pitch = std::asin(vy / radius);
              if (!std::isfinite(yaw) || !std::isfinite(pitch)) {
                  return;
              }

              yaw -= dx * SensitivityX;
              pitch += dy * SensitivityY;
              if (pitch > PitchLimit) pitch = PitchLimit;
              if (pitch < -PitchLimit) pitch = -PitchLimit;

              const float horizontal = radius * std::cos(pitch);
              const float new_vx = horizontal * std::sin(yaw);
              const float new_vy = radius * std::sin(pitch);
              const float new_vz = horizontal * std::cos(yaw);

              *pos_x = fx + new_vx;
              *pos_y = fy + new_vy;
              *pos_z = fz + new_vz;
              *up_x = 0.0f;
              *up_y = 1.0f;
              *up_z = 0.0f;
          }
          } // namespace MoonwitchTouchCamera

          // TOTK 1.4.2 target used by the current public MouseCam camera hook.
          // Build ID: 5CB42B1CF25469FB0635FD046453D843C18BC8AB
          constexpr std::uintptr_t CAMERA_UPDATE_142 = 0x00A70604;

          HOOK_DEFINE_TRAMPOLINE(MoonwitchDirectTouchCameraHook) {
              static void Callback(float delta_time, long param2, long* camera_ptr) {
                  Orig(delta_time, param2, camera_ptr);
                  MoonwitchTouchCamera::ApplyRelativeLook(camera_ptr);
              }
          };

          extern "C" void exl_main(void*, void*) {
              exl::hook::Initialize();
              nn::hid::InitializeMouse();
              MoonwitchDirectTouchCameraHook::InstallAtOffset(CAMERA_UPDATE_142);
              Logging.Log("Moonwitch TOTK direct touch camera: HID delta -> game camera");
          }

          extern "C" NORETURN void exl_exception_entry() {
              EXL_ABORT("Moonwitch TOTK touch camera exception");
          }
          CPP

          if grep -Eq 'AnalogStickR|RightStick|menuStick|GetNpadState|GetNpadStates' /tmp/totk-touch-bridge/mod/source/program/main.cpp; then
            echo 'Forbidden R-stick/gamepad camera path detected.'
            exit 1
          fi

          cd /tmp/totk-touch-bridge/mod
          make clean
          make -j2

          test -f deploy/totk-mousecam/exefs/subsdk8
          mkdir -p /tmp/out/Moonwitch-TOTK-Direct-Touch-Camera/exefs
          cp deploy/totk-mousecam/exefs/subsdk8 /tmp/out/Moonwitch-TOTK-Direct-Touch-Camera/exefs/
          if [ -f deploy/totk-mousecam/exefs/main.npdm ]; then
            cp deploy/totk-mousecam/exefs/main.npdm /tmp/out/Moonwitch-TOTK-Direct-Touch-Camera/exefs/
          fi
          cat > /tmp/out/Moonwitch-TOTK-Direct-Touch-Camera/README.txt <<'TXT'
          Moonwitch TOTK Direct Touch Camera test bridge
          Target: The Legend of Zelda: Tears of the Kingdom 1.4.2
          BID: 5CB42B1CF25469FB0635FD046453D843C18BC8AB
          Requires Moonwitch BUILD #258 or newer with Native touch camera enabled.

          Pipeline:
          Android MotionEvent delta -> Switch HID Mouse delta -> TOTK camera yaw/pitch.
          This bridge does not translate camera touch into R-Stick input.
          TXT
          cd /tmp/out
          zip -r /tmp/Moonwitch-TOTK-Direct-Touch-Camera.zip Moonwitch-TOTK-Direct-Touch-Camera

      - name: Upload TOTK bridge
        uses: actions/upload-artifact@v4
        with:
          name: MOONWITCH-TOTK-DIRECT-TOUCH-CAMERA
          path: /tmp/Moonwitch-TOTK-Direct-Touch-Camera.zip
          if-no-files-found: error
          retention-days: 7
