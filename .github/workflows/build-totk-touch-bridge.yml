name: TOTK Direct Touch Camera Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - exp/moonwitch-reference-layout-build200
    paths:
      - .github/workflows/build-totk-touch-bridge.yml

permissions:
  contents: read

jobs:
  build-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Build isolated camera hook probe
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH="$DEVKITPRO/tools/bin:$DEVKITA64/bin:$PATH"

          git clone --depth 1 https://github.com/mcrib884/totk-mousecam.git /tmp/totk-camera-probe

          cat > /tmp/totk-camera-probe/mod/source/program/main.cpp <<'CPP'
          #include "lib.hpp"
          #include "loggers.hpp"
          #include <cmath>
          #include <cstdint>

          namespace MoonwitchHookProbe {
          constexpr float AutoYawStep = 0.020f;

          static void ForceVisibleRotation(long* camera_ptr) {
              if (camera_ptr == nullptr || reinterpret_cast<std::uintptr_t>(camera_ptr) < 0x1000) {
                  return;
              }

              const auto camera_data = static_cast<std::uintptr_t>(*camera_ptr);
              if (camera_data < 0x1000) {
                  return;
              }

              auto* pos_x = reinterpret_cast<float*>(camera_data + 0x00);
              auto* pos_y = reinterpret_cast<float*>(camera_data + 0x04);
              auto* pos_z = reinterpret_cast<float*>(camera_data + 0x08);
              auto* foc_x = reinterpret_cast<float*>(camera_data + 0x0C);
              auto* foc_y = reinterpret_cast<float*>(camera_data + 0x10);
              auto* foc_z = reinterpret_cast<float*>(camera_data + 0x14);
              auto* up_x  = reinterpret_cast<float*>(camera_data + 0x18);
              auto* up_y  = reinterpret_cast<float*>(camera_data + 0x1C);
              auto* up_z  = reinterpret_cast<float*>(camera_data + 0x20);

              const float fx = *foc_x;
              const float fy = *foc_y;
              const float fz = *foc_z;
              const float vx = *pos_x - fx;
              const float vy = *pos_y - fy;
              const float vz = *pos_z - fz;
              const float radius = std::sqrt(vx * vx + vy * vy + vz * vz);
              if (!std::isfinite(radius) || radius < 0.10f || radius > 1000.0f) {
                  return;
              }

              float yaw = std::atan2(vx, vz);
              const float pitch = std::asin(vy / radius);
              if (!std::isfinite(yaw) || !std::isfinite(pitch)) {
                  return;
              }

              // Diagnostic only: if this hook really executes on the gameplay camera,
              // the camera MUST rotate horizontally without any touch input.
              yaw += AutoYawStep;
              const float horizontal = radius * std::cos(pitch);
              *pos_x = fx + horizontal * std::sin(yaw);
              *pos_y = fy + radius * std::sin(pitch);
              *pos_z = fz + horizontal * std::cos(yaw);
              *up_x = 0.0f;
              *up_y = 1.0f;
              *up_z = 0.0f;
          }
          } // namespace MoonwitchHookProbe

          constexpr std::uintptr_t CAMERA_UPDATE = 0x00A70604;

          HOOK_DEFINE_TRAMPOLINE(MoonwitchCameraHookProbe) {
              static void Callback(float delta_time, long param2, long* camera_ptr) {
                  Orig(delta_time, param2, camera_ptr);
                  MoonwitchHookProbe::ForceVisibleRotation(camera_ptr);
              }
          };

          extern "C" void exl_main(void*, void*) {
              exl::hook::Initialize();
              MoonwitchCameraHookProbe::InstallAtOffset(CAMERA_UPDATE);
              Logging.Log("Moonwitch hook probe installed at 0x00A70604");
          }

          extern "C" NORETURN void exl_exception_entry() {
              EXL_ABORT("Moonwitch camera hook probe exception");
          }
          CPP

          cd /tmp/totk-camera-probe/mod
          make clean
          make -j2

          test -f deploy/totk-mousecam/exefs/subsdk8
          mkdir -p /tmp/out/Moonwitch-TOTK-Camera-Hook-Probe/exefs
          cp deploy/totk-mousecam/exefs/subsdk8 /tmp/out/Moonwitch-TOTK-Camera-Hook-Probe/exefs/
          cat > /tmp/out/Moonwitch-TOTK-Camera-Hook-Probe/README.txt <<'TXT'
          Moonwitch TOTK camera hook diagnostic probe

          Diagnostic only. Do NOT keep this installed for normal play.

          This mod ignores touch input completely. If camera hook 0x00A70604 is really the gameplay-camera update in your TOTK build, the camera will continuously rotate horizontally by itself as soon as gameplay is visible.

          Result interpretation:
          - Camera rotates by itself: hook is correct; bug is in TouchLook transport.
          - Nothing changes: hook/offset is wrong for the running TOTK build, or this exefs module is not loading.
          - Game crashes: hook address is executing but is incompatible with the running build/ABI.
          TXT
          cd /tmp/out
          zip -r /tmp/Moonwitch-TOTK-Camera-Hook-Probe.zip Moonwitch-TOTK-Camera-Hook-Probe

      - name: Upload camera hook probe
        uses: actions/upload-artifact@v4
        with:
          name: MOONWITCH-TOTK-CAMERA-HOOK-PROBE
          path: /tmp/Moonwitch-TOTK-Camera-Hook-Probe.zip
          if-no-files-found: error
          retention-days: 7
