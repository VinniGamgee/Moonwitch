name: Build Eden Master Baseline

on:
  push:
    branches:
      - build/eden-master-baseline
    paths:
      - .github/workflows/build-eden-master-baseline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout clean Eden master baseline
        uses: actions/checkout@v4
        with:
          ref: build/eden-master-baseline
          fetch-depth: 1
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host shader tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools
          glslangValidator --version
          spirv-opt --version

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Pin CI CMake toolchain only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/android/app/build.gradle.kts')
          s = p.read_text()
          old = '''    externalNativeBuild {
        cmake {
            path = file("${edenDir}/CMakeLists.txt")
        }
    }'''
          new = '''    externalNativeBuild {
        cmake {
            path = file("${edenDir}/CMakeLists.txt")
            version = "3.31.6"
        }
    }'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'version = "3.31.6"' not in s:
              raise SystemExit('Could not locate externalNativeBuild CMake block')
          p.write_text(s)
          PY

      - name: Build clean Eden master APK
        shell: bash
        env:
          CCACHE: 'false'
        run: |
          chmod +x .ci/android/build.sh src/android/gradlew
          .ci/android/build.sh -n -t standard -b Release

      - name: Upload baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: EDEN-MASTER-BASELINE-119291dc
          path: |
            artifacts/*.apk
            artifacts/*.aab
          if-no-files-found: error
          retention-days: 7
