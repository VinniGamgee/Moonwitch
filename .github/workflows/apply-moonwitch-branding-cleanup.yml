name: Finish Moonwitch branding cleanup

on:
  push:
    paths:
      - '.github/workflows/apply-moonwitch-branding-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: exp/moonwitch-reference-layout-build200
          fetch-depth: 1

      - name: Fix remaining visible legacy labels
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('src/android/app/src/main/res')
          tag = re.compile(r'(<string\b[^>]*\bname="([^"]+)"[^>]*>)(.*?)(</string>)', re.S)

          for path in sorted(root.glob('values*/strings.xml')):
              text = path.read_text(encoding='utf-8')
              def repl(m):
                  prefix, name, body, suffix = m.groups()
                  # Keep only actual persistent IDs and URL values untouched.
                  if name == 'app_notification_channel_id' or 'http://' in body or 'https://' in body:
                      return m.group(0)
                  body = body.replace('Eden', 'Moonwitch')
                  body = re.sub(r'\beden\b', 'Moonwitch', body)
                  return prefix + body + suffix
              updated = tag.sub(repl, text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Validate every visible Android string
        shell: bash
        run: |
          git diff --check
          python3 <<'PY'
          from pathlib import Path
          import re

          tag = re.compile(r'<string\b[^>]*\bname="([^"]+)"[^>]*>(.*?)</string>', re.S)
          leftovers = []
          for path in sorted(Path('src/android/app/src/main/res').glob('values*/strings.xml')):
              for name, body in tag.findall(path.read_text(encoding='utf-8')):
                  if name == 'app_notification_channel_id' or 'http://' in body or 'https://' in body:
                      continue
                  if 'Eden' in body or re.search(r'\beden\b', body):
                      leftovers.append(f'{path}:{name}:{body.strip()}')
          if leftovers:
              raise SystemExit('Visible legacy branding remains:\n' + '\n'.join(leftovers[:100]))
          PY

      - name: Commit final cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/android/app/src/main/res
          if git diff --cached --quiet; then
            echo "No remaining visible labels to change"
            exit 0
          fi
          git commit -m "ui: remove remaining visible Eden labels"
          git push origin HEAD:exp/moonwitch-reference-layout-build200
