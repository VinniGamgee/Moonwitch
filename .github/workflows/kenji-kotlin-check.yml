name: Moonwitch Kenji Kotlin Check

on:
  workflow_dispatch:
  push:
    branches:
      - perf/moonwitch-v1.2
    paths:
      - '.github/workflows/kenji-kotlin-check.yml'
      - 'scripts/kenji-first-boot.patch'
      - 'scripts/kenji-first-boot-postprocess.py'
      - 'scripts/kenji-input-routing.patch'
      - 'src/android/app/build.gradle.kts'
      - 'src/android/app/src/main/java/org/kenjinx/**'
      - 'src/android/app/src/main/java/org/yuzu/yuzu_emu/core/**'
      - 'src/android/app/src/main/java/org/yuzu/yuzu_emu/utils/EmulationCorePreference.kt'
      - 'src/android/app/src/main/java/org/yuzu/yuzu_emu/utils/InputHandler.kt'

concurrency:
  group: kenji-kotlin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kotlin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply first-boot routing patches
        shell: bash
        run: |
          for patch in scripts/kenji-first-boot.patch scripts/kenji-input-routing.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          python3 scripts/kenji-first-boot-postprocess.py
          git diff --check

      - name: Compile Kotlin bridge
        working-directory: src/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:compileMainlineReleaseKotlin --no-daemon --stacktrace
