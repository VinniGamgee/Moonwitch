name: TOTK UltraCam Symbol Inspection

on:
  push:
    branches:
      - diag/totk-ultracam-symbols
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect public UltraCam package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/MaxLastBreath/nx-optimizer/c41e68439ccd0c19bffc8a5bab08ffdf0b81b992/scripts/Mods/UltraCam/UltraCam.zip' \
            -o /tmp/UltraCam.zip
          rm -rf /tmp/uc
          mkdir -p /tmp/uc
          unzip -q /tmp/UltraCam.zip -d /tmp/uc
          echo '===== PACKAGE TREE ====='
          find /tmp/uc -type f -printf '%p | %s bytes\n' | sort
          echo '===== FILE TYPES ====='
          find /tmp/uc -type f -print0 | while IFS= read -r -d '' f; do
            echo "--- $f ---"
            file "$f" || true
          done
          echo '===== RELEVANT RAW STRINGS ====='
          find /tmp/uc -type f -print0 | while IFS= read -r -d '' f; do
            echo "--- $f ---"
            strings -a -t x "$f" | grep -Ei \
              '1\.4\.[0-9]|5CB42B1CF25469FB|277178B7DBA1B6D4|camera|freecam|lookat|camalpha|gamecamera|build.?id|version|0100F2C0115B6000' \
              | head -n 1000 || true
          done

      - name: Decompress and inspect UltraCam NSO
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet lz4 capstone
          cat > /tmp/inspect_nso.py <<'PY'
          import collections
          import struct
          from pathlib import Path
          import lz4.block
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM
          from capstone.arm64 import ARM64_INS_MOVZ, ARM64_INS_MOVK

          p = Path('/tmp/uc/UltraCam/exefs/subsdk3')
          b = p.read_bytes()
          assert b[:4] == b'NSO0', b[:4]
          flags = struct.unpack_from('<I', b, 0x0c)[0]
          build_id = b[0x40:0x60].hex().upper()
          print('===== NSO HEADER =====')
          print(f'flags=0x{flags:08X}')
          print(f'build_id={build_id}')

          names = ['text','rodata','data']
          hdrs = [0x10,0x20,0x30]
          comp_sizes = struct.unpack_from('<III', b, 0x60)
          segs = {}
          for i,(name,h) in enumerate(zip(names,hdrs)):
              file_off, mem_off, dec_size = struct.unpack_from('<III', b, h)
              comp_size = comp_sizes[i]
              payload = b[file_off:file_off+comp_size]
              compressed = bool(flags & (1 << i))
              if compressed:
                  payload = lz4.block.decompress(payload, uncompressed_size=dec_size)
              else:
                  payload = payload[:dec_size]
              assert len(payload) == dec_size, (name, len(payload), dec_size)
              segs[name] = (mem_off, payload)
              Path(f'/tmp/uc_{name}.bin').write_bytes(payload)
              print(f'{name}: file=0x{file_off:X} mem=0x{mem_off:X} size=0x{dec_size:X} compressed={compressed} stored=0x{comp_size:X}')

          print('===== DECOMPRESSED RELEVANT STRINGS =====')
          for name,(base,data) in segs.items():
              import re
              for m in re.finditer(rb'[ -~]{5,}', data):
                  s=m.group().decode('ascii','ignore')
                  if any(k in s.lower() for k in ['camera','freecam','lookat','version','build','ultra','hook']):
                      print(f'{name}+0x{m.start():X}: {s[:300]}')

          print('===== KNOWN OFFSET LITERAL SCAN =====')
          known = [0x00A15D40,0x00A8B40C,0x00A2E4B0,0x00A70604,0x02B180A0,0x02B18130,0x02B18100,0x04728688]
          for val in known:
              hits=[]
              for name,(base,data) in segs.items():
                  for width,fmt in [(4,'<I'),(8,'<Q')]:
                      needle=struct.pack(fmt,val)
                      start=0
                      while True:
                          j=data.find(needle,start)
                          if j<0: break
                          hits.append(f'{name}+0x{j:X}/{width}')
                          start=j+1
              print(f'0x{val:08X}: {", ".join(hits) if hits else "none"}')

          text_base,text = segs['text']
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          md.detail=True
          insns=list(md.disasm(text, text_base))
          print(f'===== AARCH64 TEXT: {len(insns)} instructions =====')

          regs={}
          candidates=[]
          for idx,ins in enumerate(insns):
              if ins.id not in (ARM64_INS_MOVZ, ARM64_INS_MOVK):
                  continue
              ops=ins.operands
              if len(ops)<2 or ops[0].type != 1 or ops[1].type != 2:
                  continue
              reg=ins.reg_name(ops[0].reg)
              imm=ops[1].imm
              shift=ops[1].shift.value if getattr(ops[1],'shift',None) else 0
              if ins.id == ARM64_INS_MOVZ:
                  val=(imm & 0xffff) << shift
              else:
                  old=regs.get(reg,0)
                  mask=0xffff << shift
                  val=(old & ~mask) | ((imm & 0xffff) << shift)
              regs[reg]=val
              if 0x00100000 <= val <= 0x08000000:
                  candidates.append((val,idx,reg))

          seen=set()
          print('===== OFFSET-LIKE CONSTANTS (MOVZ/MOVK) =====')
          for val,idx,reg in candidates:
              key=(val,insns[idx].address)
              if key in seen: continue
              seen.add(key)
              if val < 0x00200000 and val not in known:
                  continue
              lo=max(0,idx-4); hi=min(len(insns),idx+6)
              print(f'--- candidate 0x{val:08X} via {reg} @ text+0x{insns[idx].address-text_base:X} ---')
              for x in insns[lo:hi]:
                  print(f'  {x.address:08X}: {x.mnemonic:8s} {x.op_str}')

          print('===== IMMEDIATE REFERENCES NEAR KNOWN VALUES =====')
          for idx,ins in enumerate(insns):
              textline=f'{ins.mnemonic} {ins.op_str}'.lower()
              for val in known:
                  if f'#0x{val:x}' in textline or f'0x{val:x}' in textline:
                      print(f'--- 0x{val:X} @ 0x{ins.address:X} ---')
                      for x in insns[max(0,idx-8):min(len(insns),idx+12)]:
                          print(f'  {x.address:08X}: {x.mnemonic:8s} {x.op_str}')
          PY
          python3 /tmp/inspect_nso.py

# rerun 2026-09-11 direct touch diagnosis
