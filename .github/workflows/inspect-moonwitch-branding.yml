name: Inspect Moonwitch branding

on:
  push:
    paths:
      - '.github/workflows/inspect-moonwitch-branding.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: exp/moonwitch-reference-layout-build200
          fetch-depth: 1

      - name: Inventory visible Eden branding and external links
        shell: bash
        run: |
          echo '===== EDEN OCCURRENCES IN ANDROID APP ====='
          git grep -n -i 'Eden' -- src/android/app/src/main || true
          echo '===== EXACT EDEN STRING LITERALS ACROSS SOURCE ====='
          git grep -n -E '"Eden"|"eden"|Eden is Running|Eden está em execução' -- src || true
          echo '===== DEVICE / WEB USERNAME DEFAULTS ====='
          git grep -n -Ei 'device.?name|web.?username|WEB_USERNAME|username.*Eden|Eden.*username' -- src || true
          echo '===== SOCIAL / EXTERNAL LINKS IN ANDROID APP ====='
          git grep -n -Ei 'discord|reddit|twitter|x\.com|github\.com|eden-emulator|eden-emu|website_url|website' -- src/android/app/src/main || true
