name: Apply TOTK Vulkan profile

on:
  push:
    paths:
      - '.github/workflows/apply-totk-vulkan-profile.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply per-game Vulkan application profile
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/video_core/vulkan_common/vulkan_wrapper.cpp')
          text = path.read_text(encoding='utf-8')

          include_anchor = '#include "common/logging.h"\n'
          settings_include = '#include "common/settings.h"\n'
          if settings_include not in text:
              if text.count(include_anchor) != 1:
                  raise RuntimeError('Unexpected common/logging.h include layout')
              text = text.replace(include_anchor, include_anchor + settings_include, 1)

          helper_marker = 'constexpr u64 TotkProgramId = 0x0100F2C0115B6000ULL;'
          if helper_marker not in text:
              namespace_anchor = 'namespace {\n\n'
              if namespace_anchor not in text:
                  raise RuntimeError('Anonymous namespace anchor not found')
              helper = '''constexpr u64 TotkProgramId = 0x0100F2C0115B6000ULL;

          [[nodiscard]] const char* GetVulkanApplicationName() {
              // Keep the legacy application name for every other title so existing driver
              // workarounds continue to match exactly as before. TOTK gets an explicit name so
              // Turnip drivers can opt into Zelda-specific profiles without affecting other games.
              if (Settings::GetCurrentProgramID() == TotkProgramId) {
                  LOG_INFO(Render_Vulkan, "Using TOTK Vulkan application profile");
                  return "totk";
              }
              return "yuzu Emulator";
          }

          '''
              text = text.replace(namespace_anchor, namespace_anchor + helper, 1)

          old_app_name = '.pApplicationName = "yuzu Emulator",'
          new_app_name = '.pApplicationName = GetVulkanApplicationName(),'
          if new_app_name not in text:
              if text.count(old_app_name) != 1:
                  raise RuntimeError('Unexpected VkApplicationInfo application-name layout')
              text = text.replace(old_app_name, new_app_name, 1)

          path.write_text(text, encoding='utf-8')

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F '#include "common/settings.h"' src/video_core/vulkan_common/vulkan_wrapper.cpp
          grep -F 'constexpr u64 TotkProgramId = 0x0100F2C0115B6000ULL;' src/video_core/vulkan_common/vulkan_wrapper.cpp
          grep -F '.pApplicationName = GetVulkanApplicationName(),' src/video_core/vulkan_common/vulkan_wrapper.cpp

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/video_core/vulkan_common/vulkan_wrapper.cpp
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git commit -m 'video_core: add TOTK Vulkan application profile'
          git pull --rebase origin main
          git push origin HEAD:main
